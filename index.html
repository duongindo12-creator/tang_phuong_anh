<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 🌸</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng trái tim rơi nền */
        #hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .falling-heart {
            position: absolute;
            top: -10vh;
            color: rgba(255, 105, 180, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Khung chính */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d63384;
            font-size: 38px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Hộp quà */
        .gift-box-wrapper {
            cursor: pointer;
            margin: 20px auto;
            width: 120px;
            height: 120px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .gift-box-wrapper:hover {
            transform: scale(1.08);
        }

        .gift-box {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-8px);}
        }

        .instruction {
            font-size: 13px;
            color: #ff4d6d;
            font-weight: 600;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Lời chúc (Ẩn ban đầu) */
        .message-box {
            display: none;
            margin-top: 20px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            background: #fff0f3;
            border: 1px dashed #ffb3c1;
            padding: 15px;
            border-radius: 15px;
            color: #4a4a4a;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
        }

        .message-content strong {
            color: #d63384;
        }

        .signature {
            margin-top: 15px;
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #d63384;
            text-align: right;
        }

        /* Pháo hoa nổ */
        .firework-particle {
            position: fixed;
            pointer-events: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 999;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Container trái tim rơi -->
    <div id="hearts-container"></div>

    <div class="card-container">
        <h1>Gửi Baby Phương Anh 🌸</h1>
        <p class="subtitle">Nhấn vào hộp quà bên dưới để mở món quà bất ngờ nhé!</p>

        <!-- Hộp quà tương tác -->
        <div class="gift-box-wrapper" id="giftWrapper" onclick="openGift()">
            <div class="gift-box" id="giftIcon">🎁</div>
            <div class="instruction">Chạm để mở quà! 👇</div>
        </div>

        <!-- Nội dung thông điệp -->
        <div class="message-box" id="messageBox">
            <div class="message-content">
                Cảm ơn em vì đã đến thế giới của anh, chúc em ngày 20/10 thật vui vẻ, tràn đầy hạnh phúc và mãi xinh nhé! ✨
            </div>
            <div class="signature">
                Anh 💗 Em
            </div>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng trái tim rơi liên tục ở nền
        const heartsContainer = document.getElementById('hearts-container');
        const symbols = ['❤️', '💖', '🌸', '✨', '💕'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 12 + 14) + 'px';
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 400);

        // Sự kiện mở quà và tạo pháo hoa
        let opened = false;
        function openGift() {
            if (opened) return;
            opened = true;

            const giftIcon = document.getElementById('giftIcon');
            const giftWrapper = document.getElementById('giftWrapper');
            const messageBox = document.getElementById('messageBox');

            // Đổi icon hộp quà thành mở nắp/trái tim
            giftIcon.innerHTML = '💖';
            giftWrapper.style.transform = 'scale(1.2)';
            setTimeout(() => {
                giftWrapper.style.transform = 'scale(1)';
            }, 300);

            // Hiệu ứng pháo hoa bùng nổ quanh vị trí hộp quà
            const rect = giftWrapper.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;
            createFireworks(originX, originY);

            // Hiện thiệp chúc mừng sau hiệu ứng
            setTimeout(() => {
                messageBox.style.display = 'block';
                giftWrapper.style.display = 'none'; // Ẩn hộp quà đi sau khi mở xong cho gọn
            }, 400);
        }

        // Hàm tạo pháo hoa
        function createFireworks(x, y) {
            const colors = ['#ff4d6d', '#ff758c', '#ff7eb3', '#ffd166', '#ffffff', '#ffb3c1'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 120 + 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }
    </script>
</body>
</html>
