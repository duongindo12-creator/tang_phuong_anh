<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 🌸</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- HIỆU ỨNG 1: Trái tim rơi nền (Background falling hearts) --- */
        #hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Không cản trở click */
            z-index: 1;
        }

        .heart {
            position: absolute;
            top: -10vh;
            background: rgba(255, 255, 255, 0.7);
            transform: rotate(45deg);
            animation: fall linear infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: inherit;
            height: inherit;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before { top: -50%; left: 0; }
        .heart::after { left: -50%; top: 0; }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(45deg) scale(0.6); opacity: 1; }
            100% { transform: translateY(110vh) rotate(45deg) scale(1.2); opacity: 0; }
        }

        /* --- HIỆU ỨNG 2: Bắn pháo hoa trái tim (Heart Fireworks/Confetti) --- */
        .confetti-heart {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #ff4081; /* Màu pháo */
            transform: rotate(45deg);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-heart::before,
        .confetti-heart::after {
            content: '';
            position: absolute;
            width: inherit;
            height: inherit;
            background: inherit;
            border-radius: 50%;
        }

        .confetti-heart::before { top: -50%; left: 0; }
        .confetti-heart::after { left: -50%; top: 0; }

        @keyframes explode {
            0% {
                transform: translate(0, 0) rotate(45deg) scale(0);
                opacity: 1;
            }
            100% {
                /* Sẽ được set ngẫu nhiên bằng JS */
                opacity: 0;
            }
        }

        /* --- Khung chính chứa thiệp / hộp quà --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #d81b60;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Hộp quà */
        .gift-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.2);
            transition: all 0.5s ease;
            cursor: pointer;
            border: 2px dashed #ff4081;
            position: relative; /* Dùng làm tâm bắn pháo */
        }

        .gift-box:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.3);
        }

        .gift-icon {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        p.instruction {
            color: #880e4f;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Nội dung lời chúc (Ẩn ban đầu) */
        .wish-card {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            animation: fadeIn 0.8s ease forwards;
            border: 2px solid #ff80ab;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Lời chúc chính */
        .wish-card h2 {
            font-family: 'Dancing Script', cursive;
            color: #c2185b;
            font-size: 2.3rem; /* Tăng kích thước font tên */
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .wish-card p {
            color: #4a148c;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Dòng kết Anh Yêu Em */
        .love-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem; /* Nổi bật */
            color: #e91e63;
            font-weight: bold;
            margin-bottom: 25px;
            animation: pulse 1.5s infinite;
        }

        .btn-back {
            background: linear-gradient(45deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(245, 0, 87, 0.4);
            transition: background 0.3s, transform 0.2s;
        }

        .btn-back:hover {
            background: linear-gradient(45deg, #f50057, #c51162);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Container cho hiệu ứng trái tim rơi nền -->
    <div id="hearts-container"></div>

    <div class="container">
        <h1>Chúc Mừng 20/10 🌸</h1>
        
        <!-- Hộp quà tương tác -->
        <div class="gift-box" id="giftBox" onclick="openGift(event)">
            <div class="gift-icon">🎁</div>
            <p class="instruction">Nhấn vào hộp quà để mở lời chúc nhé!</p>
        </div>

        <!-- Thiệp chúc mừng xuất hiện sau khi mở -->
        <div class="wish-card" id="wishCard">
            <h2>Gửi ❤️❤️❤️ Baby Phương Anh ❤️❤️❤️</h2>
            <p>
                Cảm ơn em vì đã đến thế giới của anh, chúc em ngày 20/10 thật vui vẻ, tràn đầy hạnh phúc và mãi xinh nhé! ✨
            </p>
            <div class="love-text">Anh 💗 Em</div>
            <button class="btn-back" onclick="closeGift()">Đóng lại 💌</button>
        </div>
    </div>

    <script>
        // --- CHỨC NĂNG 1: Tạo trái tim rơi nền ---
        function createFallingHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const size = Math.random() * 20 + 10 + 'px';
            heart.style.width = size;
            heart.style.height = size;
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 3 + 3 + 's';
            heart.style.animationDuration = duration;
            
            container.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, parseFloat(duration) * 1000);
        }
        setInterval(createFallingHeart, 300); // Tạo mỗi 0.3 giây

        // --- CHỨC NĂNG 2: Mở quà và Bắn pháo hoa ---
        function openGift(event) {
            // 1. Kích hoạt hiệu ứng bắn pháo hoa từ vị trí click
            createHeartFirework(event.clientX, event.clientY);

            // 2. Chuyển đổi hiển thị (delay một chút để hiệu ứng pháo hoa bắt đầu)
            setTimeout(() => {
                document.getElementById('giftBox').style.display = 'none';
                document.getElementById('wishCard').style.display = 'block';
            }, 100); 
        }

        // --- CHỨC NĂNG 3: Đóng quà ---
        function closeGift() {
            document.getElementById('wishCard').style.display = 'none';
            document.getElementById('giftBox').style.display = 'block';
        }

        // --- CHỨC NĂNG 4: Logic bắn pháo hoa trái tim ---
        function createHeartFirework(x, y) {
            const heartCount = 30; // Số lượng trái tim bắn ra
            const colors = ['#ff4081', '#ff80ab', '#c2185b', '#e91e63']; // Các tông màu hồng/đỏ

            for (let i = 0; i < heartCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-heart');
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];

                // Set vị trí ban đầu là tâm hộp quà (vị trí click)
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                // Tạo quỹ đạo bay ngẫu nhiên
                const angle = Math.random() * Math.PI * 2; // Góc bay ngẫu nhiên 360 độ
                const velocity = Math.random() * 150 + 50; // Tốc độ bay ngẫu nhiên
                const xEnd = Math.cos(angle) * velocity + 'px';
                const yEnd = Math.sin(angle) * velocity + 'px';
                
                // Thời gian bay và delay ngẫu nhiên
                const duration = Math.random() * 0.8 + 0.5 + 's';

                // Apply animation động
                confetti.style.animation = `explode ${duration} ease-out forwards`;
                
                // Thêm keyframes động cho mỗi hạt pháo
                const styleSheet = document.styleSheets[0];
                const keyframesName = `explode_${i}`;
                
                // Định nghĩa animation bùng nổ sang vị trí mới
                styleSheet.insertRule(`
                    @keyframes ${keyframesName} {
                        0% { transform: translate(-50%, -50%) rotate(45deg) scale(0); opacity: 1; }
                        100% { transform: translate(calc(-50% + ${xEnd}), calc(-50% + ${yEnd})) rotate(calc(45deg + ${Math.random()*360}deg)) scale(${Math.random() * 1.5 + 0.5}); opacity: 0; }
                    }
                `, styleSheet.cssRules.length);
                
                confetti.style.animationName = keyframesName;

                document.body.appendChild(confetti);

                // Xóa hạt pháo sau khi animation kết thúc
                setTimeout(() => {
                    confetti.remove();
                    // styleSheet.deleteRule(styleSheet.cssRules.length - 1); // Clean keyframes nếu cần
                }, parseFloat(duration) * 1000);
            }
        }
    </script>
</body>
</html>
